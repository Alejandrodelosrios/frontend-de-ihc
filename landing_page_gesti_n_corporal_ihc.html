<!DOCTYPE html>
<html lang="es" class="scroll-smooth">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gestión Corporal - App Mobile</title>
    <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='14' fill='%230F2921'/%3E%3Cpath d='M32 50S10 37 10 22c0-7 5-12 12-12 5 0 8 3 10 7 2-4 5-7 10-7 7 0 12 5 12 12 0 15-22 28-22 28Z' fill='none' stroke='%23C3D9B5' stroke-width='4' stroke-linejoin='round'/%3E%3Cpath d='M15 31h10l4-9 6 18 5-12 3 3h6' fill='none' stroke='%23C3D9B5' stroke-width='4' stroke-linecap='round' stroke-linejoin='round'/%3E%3C/svg%3E">

    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    colors: {
                        cream: {
                            50: '#FAF7F2',
                            100: '#F4EFE6',
                            200: '#EAE2D3',
                            300: '#DDD3C0',
                            400: '#C8BB9F',
                        },
                        forest: {
                            100: '#E2EBD8',
                            200: '#C3D9B5',
                            300: '#9DBE89',
                            400: '#6E9858',
                            500: '#3B6043',
                            600: '#2A4E33',
                            700: '#1B4D3E',
                            800: '#153A2E',
                            900: '#0F2921',
                        },
                        espresso: {
                            900: '#1A2521',
                            800: '#2A3833',
                            700: '#3D4F48',
                            600: '#52665E',
                        },
                        sage: {
                            200: '#D2DFC8',
                        }
                    },
                    fontFamily: {
                        sans: ['Plus Jakarta Sans', 'Poppins', 'sans-serif'],
                    },
                    boxShadow: {
                        'soft': '0 10px 30px -5px rgba(27, 77, 62, 0.08)'
                    }
                }
            }
        }
    </script>

    <!-- FontAwesome Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    
    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet">

    <style>
        body {
            font-family: 'Plus Jakarta Sans', 'Poppins', sans-serif;
            background-color: #FAF7F2;
            color: #1A2521;
        }

        .glass-card {
            background: rgba(255, 255, 255, 0.85);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border: 1px solid rgba(234, 226, 211, 0.9);
        }

        .glass-header {
            background: rgba(250, 247, 242, 0.92);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            border-bottom: 1px solid rgba(234, 226, 211, 0.8);
        }
    </style>
</head>
<body class="min-h-screen flex flex-col justify-between overflow-x-hidden antialiased bg-cream-50 text-espresso-900 selection:bg-forest-100 selection:text-forest-800">

    <!-- Toast Container -->
    <div id="toastContainer" class="fixed top-5 right-5 z-50 flex flex-col gap-2 pointer-events-none"></div>

    <!-- Header Principal -->
    <header class="w-full glass-header sticky top-0 z-40">
        <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 h-20 flex items-center justify-between">
            
            <!-- Logo / Ícono Principal -->
            <div class="flex items-center gap-3">
                <div class="w-11 h-11 rounded-[14px] bg-[#0F2921] text-[#C3D9B5] shadow-md flex items-center justify-center border border-forest-800">
                    <i class="fa-solid fa-heart-pulse text-2xl"></i>
                </div>
                <div>
                    <h1 class="font-extrabold text-lg text-forest-800 tracking-tight leading-none">Gestión Corporal</h1>
                    <p class="text-xs text-espresso-600 mt-0.5">App Mobile</p>
                </div>
            </div>

        </div>
    </header>

    <!-- Contenido Principal Centrado -->
    <main class="flex-1 flex items-center justify-center py-8 px-4 relative">
        
        <!-- Fondo Decorativo Sutil -->
        <div class="absolute top-1/2 left-1/2 -translate-x-1/2 -translate-y-1/2 w-[500px] h-[500px] bg-forest-100/50 rounded-full blur-[100px] pointer-events-none"></div>

        <div class="max-w-4xl w-full mx-auto flex flex-col items-center justify-center z-10">
            
            <!-- Botón Principal de Descarga Centrado -->
            <div class="mt-4 flex flex-col items-center gap-3">
                     <!--
                          PARA PUBLICAR EL APK DE FLUTTER:
                          1. Genera el archivo con: flutter build apk --release
                          2. Sube build/app/outputs/flutter-apk/app-release.apk a GitHub Releases
                              (o a otro servicio de archivos que entregue una URL pública directa).
                          3. Reemplaza el valor de href por esa URL, por ejemplo:
                              href="https://github.com/USUARIO/REPOSITORIO/releases/download/v1.0.0/app-release.apk"
                          No uses la URL de la página de GitHub; debe apuntar directamente al archivo .apk.
                     -->
                <a href="#" id="apkDownloadLink" onclick="handleApkDownload(event)" class="group inline-flex items-center justify-center px-8 py-4 rounded-2xl bg-forest-700 hover:bg-forest-800 text-cream-50 font-extrabold text-lg shadow-lg shadow-forest-700/25 hover:scale-105 active:scale-95 transition-all border border-forest-600">
                    <span class="flex items-center gap-3">
                        <i class="fa-solid fa-circle-down text-xl text-sage-200 group-hover:animate-bounce"></i>
                        <span>Descargar APK Directo</span>
                    </span>
                </a>

                <!-- Especificaciones del Archivo -->
                <div class="flex items-center gap-4 text-xs font-semibold text-espresso-600">
                    <span><i class="fa-solid fa-file-code text-forest-700 mr-1"></i> app-release.apk</span>
                </div>
            </div>

        </div>
    </main>

    <!-- Modal de Progresión de Descarga -->
    <div id="downloadModal" class="fixed inset-0 z-50 flex items-center justify-center p-4 bg-espresso-900/60 backdrop-blur-md hidden">
        <div class="glass-card max-w-sm w-full rounded-3xl p-6 border border-cream-200 text-center relative shadow-card bg-white">
            
            <div class="w-14 h-14 rounded-2xl bg-forest-100 text-forest-700 flex items-center justify-center text-xl mx-auto mb-3 animate-bounce">
                <i class="fa-solid fa-cloud-arrow-down"></i>
            </div>

            <h3 class="text-lg font-extrabold text-espresso-900">Descargando APK</h3>
            <p class="text-xs text-espresso-600 mt-1" id="downloadModalStatus">Iniciando transferencia...</p>

            <div class="w-full bg-cream-200 h-2.5 rounded-full my-5 overflow-hidden border border-cream-300">
                <div id="downloadProgressBar" class="bg-forest-700 h-full rounded-full w-0 transition-all duration-300"></div>
            </div>

            <div class="flex justify-between items-center text-xs text-espresso-700 font-mono font-bold">
                <span id="downloadProgressPercent">0%</span>
                <span id="downloadProgressDetails">0 MB / 22.8 MB</span>
            </div>

            <button onclick="closeDownloadModal()" class="mt-5 px-5 py-2 rounded-xl bg-cream-200 hover:bg-cream-300 text-xs text-espresso-900 font-extrabold transition-colors">
                Cerrar
            </button>
        </div>
    </div>

    <!-- Script de Lógica -->
    <script>
        let downloadTimer = null;

        function handleApkDownload(event) {
            const link = document.getElementById("apkDownloadLink");
            const href = link ? link.getAttribute("href") : "#";

            if (!href || href === "#") {
                event.preventDefault();
                simulateApkDownload();
            } else {
                showToast("Iniciando descarga...", "success");
            }
        }

        function simulateApkDownload() {
            const modal = document.getElementById("downloadModal");
            const progressBar = document.getElementById("downloadProgressBar");
            const percentText = document.getElementById("downloadProgressPercent");
            const detailsText = document.getElementById("downloadProgressDetails");

            if (!modal) return;
            modal.classList.remove("hidden");
            progressBar.style.width = "0%";

            let progress = 0;
            downloadTimer = setInterval(() => {
                progress += Math.floor(Math.random() * 20) + 15;
                if (progress > 100) progress = 100;

                progressBar.style.width = `${progress}%`;
                percentText.innerText = `${progress}%`;
                detailsText.innerText = `${((progress / 100) * 22.8).toFixed(1)} MB / 22.8 MB`;

                if (progress >= 100) {
                    clearInterval(downloadTimer);
                    setTimeout(() => {
                        triggerSyntheticFileDownload();
                        showToast("Descarga completada", "success");
                    }, 300);
                }
            }, 200);
        }

        function closeDownloadModal() {
            if (downloadTimer) clearInterval(downloadTimer);
            document.getElementById("downloadModal")?.classList.add("hidden");
        }

        function triggerSyntheticFileDownload() {
            const blob = new Blob(["Gestión Corporal - App Mobile APK Release"], { type: 'application/vnd.android.package-archive' });
            const url = URL.createObjectURL(blob);
            const a = document.createElement('a');
            a.href = url;
            a.download = "app-release.apk";
            document.body.appendChild(a);
            a.click();
            document.body.removeChild(a);
            URL.revokeObjectURL(url);
        }

        function showToast(message) {
            const container = document.getElementById("toastContainer");
            if (!container) return;
            const toast = document.createElement("div");
            toast.className = `pointer-events-auto px-4 py-3 rounded-xl bg-white text-xs font-extrabold text-espresso-900 border border-cream-200 flex items-center gap-2 shadow-card transition-all duration-300`;
            toast.innerHTML = `<i class="fa-solid fa-circle-check text-forest-700"></i> <span>${message}</span>`;
            container.appendChild(toast);
            setTimeout(() => toast.remove(), 3000);
        }

    </script>
</body>
</html>
